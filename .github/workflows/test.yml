name: Enigma checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Core checks
        run: node selftest.js
      - name: UI script regression checks
        run: node --test ui-selftest.js
